include file("/etc/gu/media-atom-maker.private.conf")

name = "gu-media-atom-maker"

# NB: the error handler and HTTP filters are wired in MediaAtomMaker (app/di.scala).
# `play.http.errorHandler` is only honoured under runtime DI, so it has no effect here.
play.application.loader = "MediaAtomMakerLoader"
play.filters.headers.contentSecurityPolicy = "default-src 'self' 'unsafe-eval' 'unsafe-inline' data: https: wss:; worker-src 'self' blob:"
play.filters.headers.frameOptions = null

sentry {
	traces {
		sample-rate = ${?SENTRY_TRACES_SAMPLE_RATE}
	}
	local {
		enabled = false
		enabled = ${?SENTRY_LOCAL_ENABLED}
	}
	replay {
		enabled = false
		enabled = ${?SENTRY_REPLAY_ENABLED}
	}
}
